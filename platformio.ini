; PlatformIO Project Configuration File for ESP32-S3 Drone Sniffer

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload configuration
monitor_speed = 115200
upload_speed = 921600

; Build flags for ESP32-S3:
; - ARDUINO_USB_CDC_ON_BOOT=1: Enables Serial over native USB CDC
; - ARDUINO_USB_MODE=1: Standard USB Mode
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

; Flash & PSRAM settings for ESP32-S3 DevKitC-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Auto-generate include/drone_signatures.h from drone_signatures.json before build
extra_scripts = pre:tools/generate_signatures.py

